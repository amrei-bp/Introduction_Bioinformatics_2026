<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Helvetica, Arial, sans-serif" font-size="18" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#00698c"/></marker><marker id="g" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#2e9e44"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<!-- you -->
<circle cx="80" cy="95" r="22" fill="#cfeaf5" stroke="#00698c" stroke-width="2"/>
<path d="M40,165 Q40,125 80,125 Q120,125 120,165 Z" fill="#cfeaf5" stroke="#00698c" stroke-width="2"/>
<text x="80" y="195" text-anchor="middle" font-weight="bold" fill="#123">You</text>
<!-- terminal window -->
<rect x="230" y="50" width="250" height="160" rx="8" fill="#1e2a33" stroke="#00698c" stroke-width="2"/>
<rect x="230" y="50" width="250" height="26" rx="8" fill="#cfd8dc"/><rect x="230" y="66" width="250" height="10" fill="#cfd8dc"/>
<circle cx="248" cy="63" r="5" fill="#ef5350"/><circle cx="264" cy="63" r="5" fill="#ffca28"/><circle cx="280" cy="63" r="5" fill="#66bb6a"/>
<text x="245" y="108" font-family="monospace" font-size="17" fill="#8fe388">$ ls</text>
<text x="245" y="133" font-family="monospace" font-size="17" fill="#e0e0e0">data  notes.txt</text>
<text x="245" y="158" font-family="monospace" font-size="17" fill="#8fe388">$ <tspan fill="#e0e0e0">▌</tspan></text>
<text x="355" y="240" text-anchor="middle" font-weight="bold" fill="#123">Terminal</text>
<text x="355" y="262" text-anchor="middle" font-size="15" fill="#546e7a">the window, running the shell (Bash)</text>
<!-- computer -->
<rect x="640" y="60" width="200" height="130" rx="6" fill="#cfeaf5" stroke="#00698c" stroke-width="2"/>
<text x="740" y="105" text-anchor="middle" fill="#123">programs</text>
<text x="740" y="135" text-anchor="middle" fill="#123">files and folders</text>
<text x="740" y="165" text-anchor="middle" fill="#123">memory, CPUs</text>
<text x="740" y="240" text-anchor="middle" font-weight="bold" fill="#123">Computer</text>
<!-- arrows -->
<path d="M130,110 H220" stroke="#00698c" stroke-width="3" marker-end="url(#a)"/>
<text x="175" y="100" text-anchor="middle" font-size="15" fill="#00698c">type</text>
<path d="M490,105 H630" stroke="#00698c" stroke-width="3" marker-end="url(#a)"/>
<text x="560" y="90" text-anchor="middle" font-size="15" fill="#00698c">runs command</text>
<path d="M630,155 H490" stroke="#2e9e44" stroke-width="3" marker-end="url(#g)"/>
<text x="560" y="180" text-anchor="middle" font-size="15" fill="#2e9e44">output</text>
</svg>
