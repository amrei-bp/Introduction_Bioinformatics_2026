<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" font-family="Helvetica, Arial, sans-serif" font-size="18" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#00698c"/></marker><marker id="g" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#2e9e44"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<!-- laptop -->
<rect x="60" y="60" width="200" height="125" rx="8" fill="#1e2a33" stroke="#00698c" stroke-width="2"/>
<text x="75" y="100" font-family="monospace" font-size="15" fill="#8fe388">anna@laptop:~$</text>
<text x="75" y="125" font-family="monospace" font-size="15" fill="#e0e0e0">ssh anna@...</text>
<path d="M35,185 H285 L270,205 H50 Z" fill="#cfd8dc" stroke="#90a4ae" stroke-width="2"/>
<text x="160" y="240" text-anchor="middle" font-weight="bold" fill="#123">Your laptop</text>
<text x="160" y="262" text-anchor="middle" font-size="15" fill="#546e7a">today</text>
<!-- connection -->
<path d="M300,125 H560" stroke="#00698c" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#a)"/>
<text x="430" y="110" text-anchor="middle" fill="#00698c" font-weight="bold">ssh</text>
<text x="430" y="150" text-anchor="middle" font-size="15" fill="#00698c">encrypted connection</text>
<!-- server -->
<g fill="#cfeaf5" stroke="#00698c" stroke-width="2">
<rect x="580" y="50" width="160" height="40" rx="4"/><rect x="580" y="100" width="160" height="40" rx="4"/><rect x="580" y="150" width="160" height="40" rx="4"/></g>
<g fill="#2e9e44"><circle cx="600" cy="70" r="5"/><circle cx="600" cy="120" r="5"/><circle cx="600" cy="170" r="5"/></g>
<text x="672" y="76" text-anchor="middle" font-size="15" fill="#123">login node</text>
<text x="672" y="126" text-anchor="middle" font-size="15" fill="#123">compute nodes</text>
<text x="672" y="176" text-anchor="middle" font-size="15" fill="#123">storage</text>
<text x="660" y="240" text-anchor="middle" font-weight="bold" fill="#123">HPC2N server</text>
<text x="660" y="262" text-anchor="middle" font-size="15" fill="#546e7a">later in the course</text>
</svg>
