project:
  type: website
  render:
    - "*.qmd"
    - "ngs/*.qmd"
    - "!README.md"
    - "!ngs/*_notes.qmd"
  post-render: ./make_pdfs.sh

website:
  title: "Introduction to Bioinformatics"
  navbar:
    background: primary
    left:
      - href: index.qmd
        text: Home
  sidebar:
    style: "docked"
    background: "#94d6ea" # info at 65% 
    logo: figures/logo/SLUBI_logo.png
    contents:
      - text: "Home"
        href: index.qmd
      - section: "Course server"
        contents:
          - text: "Server accounts"
            href: server_accounts.qmd
          - text: "Server access"
            href: server_access.qmd
      - section: "Command line"
        contents:
          - text: "Introduction to Unix"
            href: unix/unix.qmd
          - text: "Unix Exercises"
            href: unix/unix_exercises.qmd
      - section: "Smart Greenhouses"
        contents:
          - text: "Introdcution to the module"
            href: greenhouse/index.qmd
          - text: "The sensor kit"
            href: greenhouse/kit.qmd
          - text: "Greenhouse exercises"
            href: greenhouse/exercises.qmd
          - text: "Exercise troubleshooting"
            href: greenhouse/troubleshooting.qmd
      - section: "Introduction to NGS"
        contents:
          - text: "Introduction to NGS"
            href: ngs/ngs_intro.qmd
          - text: "The data"
            href: ngs/NGS_data.qmd
          - text: "Day 1: Quality control"
            href: ngs/day1.qmd
          - text: "Day 1: QC exercises"
            href: ngs/qc_exercises.qmd
          - text: "Day 2: Mapping"
            href: ngs/day2.qmd
          - text: "Day 2: Mapping exercises"
            href: ngs/mapping_exercises.qmd

format:
  html:
    theme: [yeti, theme_colors.scss]
    css: styles.css
    toc: true
    code-copy: true
    highlight-style: github
    code-overflow: wrap

execute:
  freeze: auto