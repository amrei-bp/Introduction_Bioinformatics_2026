<rect x="698" y="93" width="24" height="10" rx="2" fill="#B45309" stroke="none" stroke-width="0" />
<text x="637.0" y="230" font-size="16" fill="#555" text-anchor="middle">database: millions of</text>
<text x="637.0" y="248" font-size="16" fill="#555" text-anchor="middle">sequences</text>
