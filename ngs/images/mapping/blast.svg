<circle cx="297" cy="43" r="15" fill="#008cba"/>
<text x="297" y="49" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
<text x="321" y="50" font-size="22" fill="#222" text-anchor="start" font-weight="bold">Words</text>
