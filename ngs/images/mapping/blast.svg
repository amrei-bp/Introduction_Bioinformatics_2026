<text x="896.0" y="295" font-size="19" fill="#333" text-anchor="middle">both ways while the</text>
<text x="896.0" y="316" font-size="19" fill="#333" text-anchor="middle">score stays high</text>
<line x1="1009" y1="175.0" x2="1040" y2="175.0" stroke="#555" stroke-width="4" marker-end="url(#ar)"/>
<rect x="1048" y="15" width="214" height="320" rx="12" fill="#f4f8f8" stroke="#c9dcdc" stroke-width="2" />
<circle cx="1074" cy="43" r="15" fill="#008cba"/>
<text x="1074" y="49" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">5</text>
<text x="1098" y="50" font-size="22" fill="#222" text-anchor="start" font-weight="bold">Score</text>
<text x="1072" y="110" font-size="19" fill="#2e7d32" text-anchor="start" font-weight="bold">hit 1</text>
<text x="1238" y="110" font-size="19" fill="#2e7d32" text-anchor="end" font-family="Menlo, Consolas, monospace">E = 2e-45</text>
<text x="1072" y="144" font-size="19" fill="#2e7d32" text-anchor="start" font-weight="bold">hit 2</text>
<text x="1238" y="144" font-size="19" fill="#2e7d32" text-anchor="end" font-family="Menlo, Consolas, monospace">E = 3e-12</text>
<text x="1072" y="178" font-size="19" fill="#999" text-anchor="start" font-weight="bold">hit 3</text>
<text x="1238" y="178" font-size="19" fill="#999" text-anchor="end" font-family="Menlo, Consolas, monospace">E = 0.8</text>
<text x="1155.0" y="218" font-size="16" fill="#555" text-anchor="middle">small E: not chance</text>
<text x="1155.0" y="295" font-size="19" fill="#333" text-anchor="middle">rank hits by</text>
<text x="1155.0" y="316" font-size="19" fill="#333" text-anchor="middle">E-value</text>
