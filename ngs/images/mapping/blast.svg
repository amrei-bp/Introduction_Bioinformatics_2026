<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1272 360" font-family="Lato, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#008cba"/></marker><marker id="arO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs>
<rect x="12" y="15" width="214" height="320" rx="12" fill="#f4f8f8" stroke="#c9dcdc" stroke-width="2" />
<circle cx="38" cy="43" r="15" fill="#008cba"/>
<text x="38" y="49" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
<text x="62" y="50" font-size="22" fill="#222" text-anchor="start" font-weight="bold">Query</text>
<text x="119.0" y="120" font-size="19" fill="#00698c" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace">ATGGCTTCAAG</text>
<text x="119.0" y="146" font-size="19" fill="#00698c" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, monospace">CTTAGCAGT…</text>
<text x="119.0" y="295" font-size="19" fill="#333" text-anchor="middle">one sequence</text>
<text x="119.0" y="316" font-size="19" fill="#333" text-anchor="middle">you want to know</text>
